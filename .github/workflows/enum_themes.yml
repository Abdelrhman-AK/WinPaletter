name: EnumThemes
run-name: Enumerate themes into a database file 'store.wpdb'

on:
  push:
    branches: [ master ]
    paths: Store/Themes/**
  workflow_dispatch:

permissions:
  contents: write # needed so the script can push the updated store.wpdb

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5 # checkout the repository content

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x' # install latest python version

      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install GitPython

      - name: execute py script # run buildDB.py
        id: getfiles
        # arguments: Directory OutputFile
        run: python Store/buildDB.py Store/Themes Store/store.wpdb
